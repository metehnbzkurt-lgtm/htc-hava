name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android projesini olustur
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          mkdir -p app/src/main/assets app/src/main/java/com/example/htcweather
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'HtcWeather'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.example.htcweather'
            compileSdk 34
            defaultConfig {
              applicationId 'com.example.htcweather'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <application android:label="HTC Hava" android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/htcweather/MainActivity.java <<'EOF'
          package com.example.htcweather;
          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              requestPermissions(new String[]{Manifest.permission.ACCESS_COARSE_LOCATION}, 1);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              w = new WebView(this);
              w.setBackgroundColor(0xFF1D2630);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setGeolocationEnabled(true);
              w.setWebChromeClient(new WebChromeClient() {
                @Override public void onGeolocationPermissionsShowPrompt(String o, GeolocationPermissions.Callback c) { c.invoke(o, true, false); }
              });
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) w.setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }
            @Override protected void onResume() { super.onResume(); w.onResume(); w.evaluateJavascript("if(window.wipe)wipe(1)", null); }
            @Override protected void onPause() { super.onPause(); w.onPause(); }
          }
          EOF
      - name: Derle
        run: gradle assembleDebug --no-daemon
      - name: APK'yi yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HTC Hava v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
